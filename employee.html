<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>내 카드 — 코나비즈</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="app.css">
</head>
<body data-app="employee">
  <a class="skip-link" href="#main">본문 바로가기</a>

  <div class="app">
    <!-- ===================== 상단 바 (1024 미만) ===================== -->
    <header class="app-topbar">
      <a class="logo" href="employee.html" aria-label="코나비즈 내 카드">
        <img class="logo__img logo__img--header" src="assets/logo-ink.svg" alt="" width="172" height="24">
      </a>
      <button class="icon-btn" type="button" aria-label="메뉴 열기" aria-expanded="false" aria-controls="drawer">
        <img src="assets/icon-menu.svg" alt="" width="24" height="24">
      </button>
    </header>

    <!-- ===================== 사이드바 (admin-sidebar, Role=Employee) ===================== -->
    <aside class="sidebar">
      <div class="sidebar__inner">
        <a class="logo sidebar__logo" href="employee.html" aria-label="코나비즈 내 카드">
          <img src="assets/logo-ink.svg" alt="" width="186" height="26">
        </a>
        <div class="sidebar__divider" aria-hidden="true"></div>
        <nav aria-label="임직원 메뉴">
          <ul class="sidebar__nav">
            <li><a class="sidebar__link" href="employee.html" aria-current="page">내 카드</a></li>
            <li><span class="sidebar__link" aria-disabled="true">결제내역 <span class="sidebar__soon">준비 중</span></span></li>
            <li><span class="sidebar__link" aria-disabled="true">설정 <span class="sidebar__soon">준비 중</span></span></li>
            <li><span class="sidebar__link" aria-disabled="true">가이드 <span class="sidebar__soon">준비 중</span></span></li>
          </ul>
        </nav>
        <div class="sidebar__spacer"></div>
        <div class="sidebar__divider" aria-hidden="true"></div>
        <div class="sidebar__account">
          <p class="sidebar__name">김민준 님</p>
          <p class="sidebar__meta">가나다테크(주) · 개발팀</p>
        </div>
        <a class="sidebar__link" href="index.html" data-logout>로그아웃</a>
      </div>
    </aside>

    <!-- ===================== 본문 ===================== -->
    <main id="main" class="app-main" aria-labelledby="page-title">
      <div class="page-header">
        <h1 id="page-title" class="page-header__title">내 카드</h1>
      </div>
      <div class="mypage">
        <div class="mypage__left">
          <div class="card-area" data-card-area></div>
          <section class="panel" aria-labelledby="points-title" data-points></section>
        </div>
        <div class="mypage__right">
          <!-- 결제 테스트(시연용) — 결제내역 바로 위. 로그인한 본인 화면에서만 보임 (Sandbox · ?state= 미리보기는 hidden 그대로, DB에 안 씀) -->
          <section class="panel paytest" aria-labelledby="paytest-title" data-paytest hidden>
            <div class="panel__head">
              <h2 id="paytest-title" class="panel__title">결제 테스트 (시연용)</h2>
              <p class="panel__desc">실제 결제는 매장에서 카드로 이뤄져요. 이 영역은 시연을 위한 테스트 결제입니다.</p>
            </div>
            <form class="paytest__form" novalidate data-paytest-form>
              <div class="paytest__row">
                <div class="field paytest__merchant" data-paytest-field="merchant">
                  <label class="field__label" for="paytest-merchant">가맹점 이름</label>
                  <div class="field__control">
                    <input id="paytest-merchant" class="field__input" type="text" maxlength="40" autocomplete="off"
                           placeholder="예) 달빛우동 성수점" aria-describedby="paytest-merchant-error" aria-invalid="false">
                  </div>
                  <p id="paytest-merchant-error" class="field__error"></p>
                </div>
                <div class="field paytest__amount" data-paytest-field="amount">
                  <label class="field__label" for="paytest-amount">금액 (원)</label>
                  <div class="field__control">
                    <input id="paytest-amount" class="field__input" type="text" inputmode="numeric" autocomplete="off"
                           placeholder="9,000" aria-describedby="paytest-amount-error" aria-invalid="false">
                  </div>
                  <p id="paytest-amount-error" class="field__error"></p>
                </div>
                <button class="btn btn--primary paytest__submit" type="submit">테스트 결제하기</button>
              </div>
              <div class="paytest__chips">
                <div class="chip-group" role="group" aria-labelledby="paytest-chips-merchant">
                  <p id="paytest-chips-merchant" class="chip-group__title">예시 가맹점</p>
                  <div class="chip-group__row" data-paytest-chips="merchant"></div>
                </div>
                <div class="chip-group" role="group" aria-labelledby="paytest-chips-amount">
                  <p id="paytest-chips-amount" class="chip-group__title">금액</p>
                  <div class="chip-group__row" data-paytest-chips="amount"></div>
                </div>
              </div>
            </form>
            <div class="result-box paytest__result" role="status" aria-live="polite" data-paytest-result>
              <p class="result-box__idle">가맹점과 금액을 넣고 [테스트 결제하기]를 눌러보세요</p>
            </div>
          </section>
          <section class="panel" aria-labelledby="history-title" data-history></section>
          <!-- AI 판별기 — 결제내역 아래 (모바일: 카드 → 포인트 → 결제내역 → 판별) -->
          <section class="panel" aria-labelledby="precheck-title">
            <div class="panel__head">
              <div class="panel__title-row">
                <h2 id="precheck-title" class="panel__title">결제 전에 확인하기</h2>
                <span class="badge-status badge-status--ai">AI</span>
              </div>
              <p class="panel__desc">이 가게에서 결제될까요? 가맹점 이름을 넣으면 어떤 포인트로 결제될지 미리 알려드려요.</p>
            </div>
            <div data-classifier></div>
          </section>
        </div>
      </div>
    </main>
  </div>

  <!-- ===================== 챗봇 FAB (전역) — 패널은 chatbot.js가 FAB 앞에 만듦 ===================== -->
  <button class="fab-chatbot" type="button" aria-label="챗봇 열기" aria-controls="chat-panel" aria-expanded="false">
    <img src="assets/icon-chat.svg" alt="" width="24" height="24">
  </button>

  <!-- ===================== 드로어 (1024 미만) — 사이드바 내용을 app.js가 복사 ===================== -->
  <div class="drawer-overlay" data-drawer-close hidden></div>
  <aside id="drawer" class="drawer drawer--app" role="dialog" aria-modal="true" aria-label="메뉴" hidden>
    <button class="icon-btn drawer__close" type="button" aria-label="메뉴 닫기" data-drawer-close>
      <img src="assets/icon-close.svg" alt="" width="20" height="20">
    </button>
    <div class="drawer__body" data-drawer-body></div>
  </aside>

  <script src="js/common.js"></script>
  <script src="js/chat-reply.js"></script>
  <script src="js/chatbot.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/sandbox-mode.js"></script>
  <script src="js/app.js"></script>
  <script src="js/classifier.js"></script>
  <script src="js/employee.js"></script>
</body>
</html>
